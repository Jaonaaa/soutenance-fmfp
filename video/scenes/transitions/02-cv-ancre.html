<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Détails du contrôle du CV</title>
<link rel="stylesheet" href="../../../../fmfp/assets/fmfp_assets/css/ai-cv-check.css">
<style>
  :root { --fmfp-paper: #fff; --fmfp-ink: #182638; --fmfp-ink-2: #364455; --fmfp-ink-3: #546478; --fmfp-ink-4: #667584; --fmfp-rule-2: #e0e5e9; --fmfp-bad: #a1262d; }
  body { margin: 0; font: 13px Arial, sans-serif; }
  img { display: block; width: 1600px; height: 900px; }
  .fm-annexes .cv-check-result {
    position: absolute; display: flex; left: 1228px; top: 412px;
    width: 310px; padding: 12px; box-sizing: border-box; overflow: visible;
    animation: none; opacity: 1; background: white;
    border: 1px solid #edb8b9; border-radius: 11px;
    box-shadow: 0 7px 18px #30202a22;
  }
  .anchor {
    position: absolute; top: 369px; left: 1464px;
    height: 43px; border-left: 1px solid #bd6066;
  }
  .anchor::before {
    content: ''; position: absolute; left: -3px; top: 0;
    width: 5px; height: 5px; border-radius: 50%; background: #bd6066;
  }
  .fm-annexes .cv-check-result__head { padding-bottom: 8px; border-bottom: 1px solid #e0e5e9; }
  .cv-check-result__heading strong { color: #9c292d; }
</style>
</head>
<body>
<img src="../../out/transitions/02-cv-frame.png" alt="">
<div class="fm-annexes">
  <span class="anchor" aria-hidden="true"></span>
  <section class="cv-check-result is-error" aria-label="Détails du contrôle CV">
    <header class="cv-check-result__head">
      <span class="cv-check-result__icon" aria-hidden="true">⚠</span>
      <span class="cv-check-result__heading"><strong>CV à corriger</strong> <span class="cv-check-result__count">4 points à corriger</span></span>
    </header>
    <ul class="cv-check-result__list"></ul>
  </section>
</div>
<script>
  const findings = [
    ['Dates obligatoires', 'Une date obligatoire est absente, invalide ou conserve le placeholder du canevas.'],
    ['Sections obligatoires', 'Une ou plusieurs sections obligatoires du canevas sont absentes.'],
    ['Mise en page', 'Le format de page ou le découpage des sections a été modifié.'],
    ['Signature', 'Aucune signature n’a été trouvée sous la zone prévue.'],
  ];
  const list = document.querySelector('.cv-check-result__list');
  for (const [label, detail] of findings) {
    const row = document.createElement('li');
    row.className = 'cv-check-result__item';
    const icon = document.createElement('span');
    icon.className = 'cv-check-result__item-icon';
    icon.textContent = '›';
    const copy = document.createElement('span');
    copy.className = 'cv-check-result__item-copy';
    for (const [className, text] of [['label', label], ['message', detail]]) {
      const span = document.createElement('span');
      span.className = 'cv-check-result__item-' + className;
      span.textContent = text;
      copy.append(span);
    }
    row.append(icon, copy);
    list.append(row);
  }
</script>
</body>
</html>
