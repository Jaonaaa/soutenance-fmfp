<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1600, initial-scale=1">
  <title>Transition · Préparer la demande</title>
  <style>
    @font-face {
      font-family: Virgil;
      src: url("../../assets/fonts/Virgil.woff2") format("woff2");
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body { width: 1600px; height: 900px; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #173b5d;
      background:
        radial-gradient(ellipse at 50% 32%, rgba(208, 234, 245, .85), transparent 48%),
        #f4f8fa;
      font-family: Virgil, "Comic Sans MS", cursive;
    }
    main {
      width: 1220px;
      min-height: 690px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 80px 46px;
      border: 2px solid #d8e7ef;
      border-radius: 38px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 24px 70px rgba(26, 65, 93, .09);
      text-align: center;
      position: relative;
    }
    .step {
      position: absolute;
      top: 32px;
      right: 38px;
      padding: 9px 16px 7px;
      border: 2px solid #d5e8ef;
      border-radius: 999px;
      color: #527187;
      font-size: 20px;
    }
    .doodle { width: 340px; height: 208px; margin: 0 0 10px; overflow: visible; }
    h1 {
      margin: 3px 0 6px;
      color: #124c79;
      font-size: 68px;
      font-weight: 400;
      line-height: 1.08;
    }
    p {
      margin: 8px 0 23px;
      color: #466579;
      font-size: 31px;
      line-height: 1.25;
    }
    .path { width: 275px; height: 32px; }
    .path path { fill: none; stroke: #6daea4; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1 12; }
    .path circle { fill: #f0bb54; stroke: #fff; stroke-width: 3; }
    .tag {
      margin-top: 16px;
      color: #698596;
      font-size: 18px;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <main>
    <div class="step">01 → 02</div>
    <svg class="doodle" viewBox="0 0 340 208" aria-hidden="true">
      <path d="M53 115 C81 75 107 76 133 101 S183 139 213 99" fill="none" stroke="#8bbcb6" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 13"/>
      <path d="M202 87 l17 10 -16 12" fill="none" stroke="#8bbcb6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M47 46 C49 34 66 31 73 43 C79 55 68 68 59 79 C49 68 42 58 47 46Z" fill="#ffe9b5" stroke="#b67b37" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="60" cy="48" r="3.3" fill="#b67b37"/>
      <path d="M262 30 l6 13 14 5 -14 5 -6 14 -5 -14 -14 -5 14 -5Z" fill="#ffd873" stroke="#d39b38" stroke-width="3" stroke-linejoin="round"/>
      <path d="M294 133 l4 9 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4Z" fill="#ffd873" stroke="#d39b38" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- The little folder is intentionally imperfect, like a marker doodle. -->
      <path d="M105 93 Q105 85 114 85 L146 86 L159 99 L201 99 Q210 100 211 110 L207 158 Q206 167 197 168 L112 165 Q102 164 103 155Z" fill="#cceaf3" stroke="#205b79" stroke-width="5" stroke-linejoin="round"/>
      <path d="M105 109 Q106 102 115 102 L202 105 Q210 106 209 114 L205 155 Q204 164 196 164 L112 161 Q104 161 104 153Z" fill="#fffdf8" stroke="#205b79" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M128 122 Q135 118 140 123 M164 124 Q170 120 176 125" fill="none" stroke="#205b79" stroke-width="4" stroke-linecap="round"/>
      <path d="M142 139 Q151 149 161 140" fill="none" stroke="#d88767" stroke-width="4" stroke-linecap="round"/>
      <circle cx="122" cy="132" r="3" fill="#e6a3a1"/><circle cx="185" cy="134" r="3" fill="#e6a3a1"/>
      <path d="M111 164 l-5 11 M197 166 l6 10" fill="none" stroke="#205b79" stroke-width="4" stroke-linecap="round"/>
      <path d="M88 137 l-12 8 M208 137 l13 6" fill="none" stroke="#205b79" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>On prépare la demande</h1>
    <p>Orientation, saisie du projet et pièces justificatives</p>
    <svg class="path" viewBox="0 0 275 32" aria-hidden="true">
      <path d="M8 16 C72 14 102 18 135 16 S208 13 267 16"/>
      <circle cx="8" cy="16" r="7"/><circle cx="135" cy="16" r="7"/><circle cx="267" cy="16" r="7"/>
    </svg>
    <div class="tag">CÔTÉ ENTREPRISE · DOSSIER TEXTILE</div>
  </main>
</body>
</html>
