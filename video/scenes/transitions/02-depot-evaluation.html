<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1600, initial-scale=1">
  <title>Transition · Évaluation assistée</title>
  <style>
    @font-face {
      font-family: Virgil;
      src: url("../../assets/fonts/Virgil.woff2") format("woff2");
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body { width: 1600px; height: 900px; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #173b5d;
      background:
        radial-gradient(ellipse at 50% 32%, rgba(224, 239, 225, .83), transparent 48%),
        #f4f8fa;
      font-family: Virgil, "Comic Sans MS", cursive;
    }
    main {
      width: 1220px;
      min-height: 690px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 80px 46px;
      border: 2px solid #d8e7ef;
      border-radius: 38px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 24px 70px rgba(26, 65, 93, .09);
      text-align: center;
      position: relative;
    }
    .step {
      position: absolute;
      top: 32px;
      right: 38px;
      padding: 9px 16px 7px;
      border: 2px solid #d5e8ef;
      border-radius: 999px;
      color: #527187;
      font-size: 20px;
    }
    .doodle { width: 340px; height: 208px; margin: 0 0 10px; overflow: visible; }
    h1 {
      margin: 3px 0 6px;
      color: #124c79;
      font-size: 68px;
      font-weight: 400;
      line-height: 1.08;
    }
    p {
      margin: 8px 0 23px;
      color: #466579;
      font-size: 31px;
      line-height: 1.25;
    }
    .path { width: 275px; height: 32px; }
    .path path { fill: none; stroke: #83ae8b; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1 12; }
    .path circle { fill: #f0bb54; stroke: #fff; stroke-width: 3; }
    .tag {
      margin-top: 16px;
      color: #698596;
      font-size: 18px;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <main>
    <div class="step">02 → 03</div>
    <svg class="doodle" viewBox="0 0 340 208" aria-hidden="true">
      <path d="M59 151 C87 162 104 154 123 137" fill="none" stroke="#9fc1a0" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
      <path d="M114 134 l15 -3 -4 15" fill="none" stroke="#9fc1a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M71 35 l6 13 14 5 -14 5 -6 14 -5 -14 -14 -5 14 -5Z" fill="#ffd873" stroke="#d39b38" stroke-width="3" stroke-linejoin="round"/>
      <path d="M271 38 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4Z" fill="#ffd873" stroke="#d39b38" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Checklist character with a hand-drawn magnifying glass. -->
      <path d="M116 54 Q116 46 125 46 L205 49 Q213 50 213 59 L209 155 Q208 164 199 164 L120 160 Q111 159 112 151Z" fill="#fffdf8" stroke="#205b79" stroke-width="5" stroke-linejoin="round"/>
      <path d="M133 78 l7 7 12 -15 M132 107 l7 7 11 -14 M132 136 l7 6 11 -13" fill="none" stroke="#59a27b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M159 80 l31 1 M158 109 l24 1 M158 137 l20 1" fill="none" stroke="#89a8b6" stroke-width="4" stroke-linecap="round"/>
      <path d="M130 151 Q137 158 144 151" fill="none" stroke="#d88767" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="129" cy="145" r="2.7" fill="#e6a3a1"/><circle cx="148" cy="146" r="2.7" fill="#e6a3a1"/>
      <circle cx="219" cy="112" r="33" fill="#d8f0e3" fill-opacity=".8" stroke="#205b79" stroke-width="6"/>
      <path d="M243 137 l30 31" fill="none" stroke="#205b79" stroke-width="10" stroke-linecap="round"/>
      <path d="M201 115 Q217 105 232 116" fill="none" stroke="#79b999" stroke-width="4" stroke-linecap="round"/>
      <circle cx="211" cy="111" r="3" fill="#205b79"/><circle cx="227" cy="111" r="3" fill="#205b79"/>
      <path d="M216 120 Q220 124 224 120" fill="none" stroke="#d88767" stroke-width="3" stroke-linecap="round"/>
      <path d="M93 110 l-11 5 M210 165 l-4 11" fill="none" stroke="#205b79" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>Place à l’évaluation</h1>
    <p>Analyse assistée, preuves reliées et appréciation humaine</p>
    <svg class="path" viewBox="0 0 275 32" aria-hidden="true">
      <path d="M8 16 C72 14 102 18 135 16 S208 13 267 16"/>
      <circle cx="8" cy="16" r="7"/><circle cx="135" cy="16" r="7"/><circle cx="267" cy="16" r="7"/>
    </svg>
    <div class="tag">CÔTÉ ÉVALUATEUR · AIDE À LA DÉCISION</div>
  </main>
</body>
</html>
